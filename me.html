    <style>
        :root {
            --bg-color: #ffffff;
            --cream-color: #f9f8f4;
            --text-color: #000000;
            --blend-color: #ffffff;
            --transition-speed: 1.2s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background-color: var(--bg-color);
            -webkit-font-smoothing: antialiased;
            font-weight: lighter;
            height: 100%;
            width: 100%;
            color: var(--text-color);
        }

        ::-moz-selection { background: #333; color: #fff; }
        ::selection { background: #333; color: #fff; }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            overflow: hidden; /* Maintains one-page viewport */
        }

        /* ARCHITECTURAL ELEMENTS */
        .left-panel {
            position: fixed;
            top: 0; left: 0;
            width: 28%; height: 100vh;
            background-color: var(--cream-color);
            z-index: 1;
        }

        .vertical-line {
            position: fixed;
            top: 0; left: 28%;
            width: 1px; height: 100vh;
            background-color: rgba(0, 0, 0, 0.08);
            z-index: 2;
        }

        /* MAIN CONTENT AREA */
        main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 35%; /* Offset for the sidebar */
            padding-right: 10%;
        }

        /* THE IMAGE: FIXED FILTER ISSUE */
        .image-container {
            width: 100%;
            max-width: 420px; /* Perfect size for large screens */
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: softReveal var(--transition-speed) forwards;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 30px 90px rgba(0,0,0,0.08);
            /* Removed mix-blend-mode to keep original colors */
        }

        /* TEXT CONTENT: MAINTAINING INTELLECTUAL BLEND */
        .text-content {
            mix-blend-mode: difference; /* Text remains "intelligent" */
            color: var(--text-color);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: lighter;
            letter-spacing: -0.04em;
            line-height: 1.1;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        /* NAVIGATION BUTTON */
        .close-container {
            position: absolute;
            bottom: 60px;
            right: 60px;
            mix-blend-mode: difference;
        }

        .close-btn {
            font-size: 12px;
            font-weight: lighter;
            letter-spacing: 0.4em;
            text-decoration: none;
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 14px 40px;
            transition: all 0.4s ease;
            text-transform: uppercase;
        }

        .close-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        @keyframes softReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* LARGE SCREEN ADJUSTMENTS (4K and Ultrawide) */
        @media (min-width: 1800px) {
            main { padding-left: 32%; }
            .image-container { max-width: 550px; }
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 768px) {
            .left-panel { width: 40px; }
            .vertical-line { left: 40px; }
            main { padding-left: 70px; padding-right: 30px; }
            .image-container { max-width: 280px; }
            .close-container { right: 30px; bottom: 40px; width: 100%; text-align: right; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="left-panel"></div>
    <div class="vertical-line"></div>

        <div class="image-container">
            <!-- Natural, original image without inversion -->
            <img src="sergiocayuqueo.png" alt="Sergio Ismael Cayuqueo-Perez Vera">
        </div>

        <div class="text-content">
            <h1>Sergio I. Cayuqueo-Perez Vera</h1>
        </div>

        <div class="close-container">
            <a href="index.html" class="close-btn">CLOSE</a>
        </div>
    </main>

</body>
