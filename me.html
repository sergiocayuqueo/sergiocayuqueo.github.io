<head>
    <meta charset="UTF-8">

    <!-- Standard Metatags -->
    <meta name="description" content="Portrait of Sergio Ismael Cayuqueo-Perez Vera" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <style>
        :root {
            --bg-color: #f9f8f4; /* Sophisticated Cream */
            --text-color: #000000;
            --transition-speed: 1.5s;
        }

        ::-moz-selection { background: #333; color: #fff; }
        ::selection { background: #333; color: #fff; }


        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* The Frame reveal */
        .gallery-container {
            position: relative;
            opacity: 0;
            transform: translateY(30px);
            animation: reveal var(--transition-speed) cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            padding: 25px;
            background: #ffffff; /* Art gallery matting */
            box-shadow: 0 40px 100px rgba(0,0,0,0.04);
            margin-bottom: 40px;
            transition: transform 0.6s ease;
        }

        .image-wrapper img {
            display: block;
            max-width: 400px;
            width: 100%;
            height: auto;
            filter: contrast(1.02);
        }

        /* Minimalist Download Overlay */
        .download-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            text-decoration: none;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 12px 20px;
            border: 1px solid rgba(0,0,0,0.1);
            opacity: 0;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .image-wrapper:hover .download-btn {
            opacity: 1;
            transform: translateY(-5px);
        }

        /* Typography */
        .info {
            text-align: center;
        }

        h1 {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        p {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.4;
        }

        /* Navigation */
        .back-home {
            position: fixed;
            bottom: 40px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0.3;
            transition: opacity 0.4s ease;
            border-bottom: 1px solid transparent;
        }

        .back-home:hover {
            opacity: 1;
            border-bottom: 1px solid rgba(0,0,0,0.2);
        }

        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile specific behavior */
        @media (max-width: 768px) {
            .image-wrapper img { max-width: 300px; }
            .download-btn {
                opacity: 1; /* Always visible on touch screens */
                bottom: 30px;
                right: 30px;
            }
        }
    </style>
</head>
<body>

    <main class="gallery-container">
        <div class="image-wrapper">
            <img src="sergiocayuqueo.png" alt="Sergio Ismael Cayuqueo-Perez Vera">
            
            <!-- Download Button: 'download' attribute forces the browser to save the file -->
            <a href="sergiocayuqueo.png" download="Sergio_Cayuqueo_Profile" class="download-btn">
                Download Image
            </a>
        </div>
        
        <div class="info">
            <h1>Sergio I. Cayuqueo-Perez Vera</h1>
            <p>Architect of Dreams</p>
        </div>
    </main>

    <a href="index.html" class="back-home">CLOSE</a>

</body>
</html>
