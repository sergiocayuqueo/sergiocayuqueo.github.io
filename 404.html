    <style>
        :root {
            --bg-color: #ffffff;
            --cream-color: #f9f8f4;
            --blend-text-color: #ffffff; 
            --blur-amount: 12px;
            --transition-speed: 1.2s;
            --resize-speed: 0.6s; 
        }

        ::-moz-selection { background: #333; color: #fff; }
        ::selection { background: #333; color: #fff; }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            overflow-x: hidden;
            background-color: var(--bg-color);
            -webkit-font-smoothing: antialiased;
            font-weight: 100; /* Thin weight */
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.4;
        }

        /* Soft Resizing Transitions */
        main, h1, .content-wrapper, .left-panel, .vertical-line {
            transition: padding var(--resize-speed) ease, 
                        margin var(--resize-speed) ease, 
                        font-size var(--resize-speed) ease, 
                        width var(--resize-speed) ease, 
                        left var(--resize-speed) ease;
        }

        /* LAYOUT ELEMENTS */
        .left-panel {
            position: fixed;
            top: 0; left: 0;
            width: 28%; height: 100vh;
            background-color: var(--cream-color);
            z-index: 1;
        }

        .vertical-line {
            position: fixed;
            top: 0; left: 28%;
            width: 1px; height: 100vh;
            background-color: rgba(0, 0, 0, 0.08);
            z-index: 2;
        }

        /* THE FLUID GIF */
        .fluid-scene {
            position: fixed;
            top: 0; right: -10%;
            width: 80vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            pointer-events: none;
            opacity: 0.5;
            filter: grayscale(1);
        }

        .fluid-gif {
            width: min(500px, 70vw);
            height: auto;
            animation: errant-float 20s infinite linear; 
        }

        @keyframes errant-float {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* GLOBAL BLENDING */
        main, footer {
            mix-blend-mode: difference;
            color: var(--blend-text-color);
            position: relative;
            z-index: 20;
        }

        main {
            padding: 160px 40px 10vh 80px;
            max-width: 1100px;
        }

        h1 {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 100;
            margin-bottom: 40px;
            letter-spacing: -0.08em;
            text-transform: uppercase;
        }

        .content-wrapper {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: 100;
            letter-spacing: -0.02em;
        }

        .line {
            display: block;
            opacity: 0;
            filter: blur(var(--blur-amount));
            transform: translate3d(0, 40px, 0); 
            transition: 
                opacity var(--transition-speed) ease-out,
                filter var(--transition-speed) ease-out,
                transform var(--transition-speed) ease-out;
            margin-bottom: 15px;
        }

        .line.active {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0);
        }

        /* FOOTER NAVIGATION */
        footer {
            padding: 40px 80px;
            display: flex;
            gap: 40px;
        }

        footer a {
            color: inherit;
            text-decoration: none;
            font-size: 11px;
            font-weight: 100;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 20px;
            transition: all 0.4s ease;
        }

        footer a:hover {
            background: #fff;
            color: #000;
        }

        @media (max-width: 768px) {
            .left-panel { width: 15%; }
            .vertical-line { left: 15%; }
            main { padding: 120px 20px 10vh 40px; }
            footer { flex-direction: column; padding: 40px; }
        }
    </style>
</head>
<body>

    <div class="left-panel"></div>
    <div class="vertical-line"></div>

    <div class="fluid-scene">
        <img src="fluid.gif" alt="Animated Background" class="fluid-gif">
    </div>

    <main>
        <h1>404</h1>

        <article class="content-wrapper">
            <span class="line">Did you wander too far from the present?</span>
            <br>
            <span class="line">Return to the origin</span>
        </article>
    </main>

    <footer>
        <a href="index.html">RETURN TO LIGHT</a>
        <a href="me.html">ME</a>
    </footer>

    <script>
        // Trigger animations sequentially for a soft entrance
        document.addEventListener('DOMContentLoaded', () => {
            const lines = document.querySelectorAll('.line');
            lines.forEach((line, index) => {
                setTimeout(() => {
                    line.classList.add('active');
                }, 200 * index);
            });
        });
    </script>
</body>
